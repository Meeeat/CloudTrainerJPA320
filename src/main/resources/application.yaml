server:
  port: 24110

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/distcomp
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: DROP SCHEMA IF EXISTS distcomp CASCADE; CREATE SCHEMA IF NOT EXISTS distcomp; SET search_path TO distcomp;
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: public
  liquibase:
    enabled: false

logging:
  level:
    org.hibernate.SQL: DEBUG